<html lang="es" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio | Ignacio Fischoff</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            /* Fondo con imagen de código de Unsplash y superposición oscura */
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                             url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }

        .cover-container {
            max-width: 42em;
        }

        /* Centrado vertical de las secciones */
        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }

        /* === ESTILO CORREGIDO PARA EL AVATAR CIRCULAR === */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Hace el círculo perfecto */
            object-fit: cover;   /* Asegura que la imagen llene el círculo sin deformarse */
            border: 4px solid white; /* Borde blanco grueso */
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); /* Sombra suave */
            background-color: #f0f0f0; /* Fondo gris claro por si acaso */
        }

        /* Estilo para los enlaces simples de contacto */
        .link-sencillo {
            color: rgba(255,255,255,0.8);
            text-decoration: underline;
            font-size: 1.2rem;
            margin: 10px 0;
            display: block;
            transition: color 0.3s ease;
        }

        .link-sencillo:hover {
            color: #00d4ff; /* Azul cian al pasar el ratón */
        }

        /* Clases auxiliares para la navegación */
        .nav-masthead .nav-link {
            padding: .25rem 0;
            font-weight: 700;
            color: rgba(255,255,255,.5);
            background-color: transparent;
            border-bottom: .25rem solid transparent;
        }

        .nav-masthead .nav-link:hover,
        .nav-masthead .nav-link:focus {
            border-bottom-color: rgba(255,255,255,.25);
        }

        .nav-masthead .active {
            color: #fff;
            border-bottom-color: #fff;
        }
    </style>
</head>
